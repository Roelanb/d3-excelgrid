apiVersion: apps/v1
kind: Deployment
metadata:
  name: reportgenerator
  namespace: reportai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reportgenerator
  template:
    metadata:
      labels:
        app: reportgenerator
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: reportgenerator
          image: beecodersregistry.azurecr.io/reportai-reportgenerator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: "https://reportmaker.example.com"
          readinessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: reportgenerator
  namespace: reportai
spec:
  selector:
    app: reportgenerator
  ports:
    - name: http
      port: 80
      targetPort: 8080
