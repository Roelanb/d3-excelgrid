apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlrest
  namespace: reportai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlrest
  template:
    metadata:
      labels:
        app: sqlrest
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: sqlrest
          image: beecodersregistry.azurecr.io/reportai-sqlrest:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: sqlrest-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sqlrest
  namespace: reportai
spec:
  selector:
    app: sqlrest
  ports:
    - name: http
      port: 80
      targetPort: 8080
