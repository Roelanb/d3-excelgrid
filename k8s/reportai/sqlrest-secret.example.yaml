apiVersion: v1
kind: Secret
metadata:
  name: sqlrest-secrets
  namespace: reportai
type: Opaque
stringData:
  DB_SERVER: "your_server_address"
  DB_NAME: "AdventureWorks2022"
  DB_USER: "your_database_user"
  DB_PASSWORD: "your_database_password"
  DB_TRUST_CERT: "true"
  JWT_KEY: "your-secret-jwt-key-at-least-32-characters-long"
  JWT_ISSUER: "SqlRestApi"
  JWT_AUDIENCE: "SqlRestApi"
  JWT_EXPIRY_MINUTES: "60"
  AUTH_USERNAME: "admin"
  AUTH_PASSWORD: "admin"
  CORS_ALLOWED_ORIGINS: "https://excel-grid.example.com,https://reportmaker.example.com"
